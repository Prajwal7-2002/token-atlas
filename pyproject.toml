[project]
name = "token-atlas"
version = "0.1.0"
description = "Universal multilingual tokenizer efficiency benchmark & global linguistic inflation atlas."
readme = "README.md"
authors = [
    { name = "Prajwal7-2002", email = "prajwalpujari16@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
    "tokenizers>=0.19.0",
    "transformers>=4.40.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
token-atlas = "token_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
